name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim-version: ["2.0.0", "stable"]
    name: test (${{ matrix.os }}, Nim ${{ matrix.nim-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Prime Nimble index
        run: nimble refresh -y

      - name: Build & Test
        run: nimble test -y
