name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: stable

      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [ "${TAG}" = "${VERSION}" ] || [ -z "${VERSION}" ]; then
            echo "release tag must use the v<version> form" >&2
            exit 1
          fi

          grep -Fq "version       = \"${VERSION}\"" entlint.nimble
          grep -Fq "Version* = \"${VERSION}\"" src/entlint.nim
          grep -Eq "^## ${VERSION} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md

      - name: Prime Nimble index
        run: nimble refresh -y

      - name: Test
        run: nimble test -y

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: stable

      - name: Build, smoke-test, and checksum
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p dist

          case "${{ matrix.os }}" in
            ubuntu-latest) OS_ID="linux"; EXT="" ;;
            macos-latest) OS_ID="macos"; EXT="" ;;
            windows-latest) OS_ID="windows"; EXT=".exe" ;;
            *) echo "unsupported runner: ${{ matrix.os }}" >&2; exit 1 ;;
          esac

          ARCH="$(uname -m)"
          OUT="entlint-${TAG}-${OS_ID}-${ARCH}${EXT}"
          nim c -d:release -o:"dist/${OUT}" src/entlint.nim

          VERSION_OUTPUT="$("./dist/${OUT}" --version)"
          printf '%s\n' "${VERSION_OUTPUT}"
          printf '%s\n' "${VERSION_OUTPUT}" | grep -Fq "${VERSION}"

          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${OUT}" > "${OUT}.sha256"
          else
            shasum -a 256 "${OUT}" > "${OUT}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: entlint-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
